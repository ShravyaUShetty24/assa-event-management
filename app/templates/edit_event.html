{% extends "base.html" %}
{% block title %}Edit Event — ASSA{% endblock %}

{% block content %}
<div class="page-header">
  <div class="container">
    <h1>Edit Event</h1>
    <p>Update the details for "{{ event.title }}".</p>
  </div>
</div>

<section class="section">
  <div class="container">
    <div class="card" style="max-width: 800px; margin: 0 auto;">
      <div class="card__body">
        <form id="editEventForm">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="title">Event Title</label>
              <input type="text" id="title" class="input" value="{{ event.title }}" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="category">Category</label>
              <select id="category" class="input select" required>
                <option value="Music" {% if event.category=='Music' %}selected{% endif %}>Music</option>
                <option value="Sports" {% if event.category=='Sports' %}selected{% endif %}>Sports</option>
                <option value="Health" {% if event.category=='Health' %}selected{% endif %}>Health</option>
                <option value="Business" {% if event.category=='Business' %}selected{% endif %}>Business</option>
                <option value="Marriage" {% if event.category=='Marriage' %}selected{% endif %}>Marriage</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="artist">Subtitle / Artist</label>
            <input type="text" id="artist" class="input" value="{{ event.artist or '' }}"
              placeholder="e.g. IPL 2026 or Artist Name">
          </div>

          <div class="form-group">
            <label class="form-label" for="description">Description</label>
            <textarea id="description" class="input textarea" required>{{ event.description }}</textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="date">Date</label>
              <input type="date" id="date" class="input" value="{{ event.date.strftime('%Y-%m-%d') }}" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="time">Time</label>
              <input type="time" id="time" class="input" value="{{ event.date.strftime('%H:%M') }}" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="location">Location</label>
            <input type="text" id="location" class="input" value="{{ event.location }}" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="ticketType">Ticket Type</label>
              <select id="ticketType" class="input select" onchange="togglePrice(this.value)">
                <option value="Free" {% if event.price==0 %}selected{% endif %}>Free</option>
                <option value="Paid" {% if event.price> 0 %}selected{% endif %}>Paid</option>
              </select>
            </div>
            <div class="form-group" id="priceGroup"
              style="display: {% if event.price > 0 %}block{% else %}none{% endif %};">
              <label class="form-label" for="price">Price (₹)</label>
              <input type="number" id="price" class="input" value="{{ event.price|round|int }}" min="0">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Event Banner</label>
            <div id="imagePreviewContainer" class="image-preview-container"
              style="margin-bottom: 1rem; position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; background: var(--olive-ghost); display: {% if event.image_url %}block{% else %}none{% endif %};">
              <img id="imagePreview" src="{{ event.image_url }}" alt="Preview"
                style="width: 100%; height: 100%; object-fit: cover;">
            </div>
            <div class="input-group">
              <input type="file" id="imageUpload" class="input" accept=".jpg,.jpeg,.png">
            </div>
            <p class="help-text">Recommended size: 1200x675px. Only JPG, PNG allowed.</p>
            <input type="hidden" id="image_url" value="{{ event.image_url }}">
          </div>

          <div class="form-actions" style="margin-top: 2rem; display: flex; gap: 1rem;">
            <button type="submit" id="saveBtn" class="btn btn-primary btn-lg" style="flex: 1;">Save Changes</button>
            <a href="{{ url_for('main.manage_events') }}" class="btn btn-outline btn-lg">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>

<script>
  // Image Preview logic
  document.getElementById('imageUpload').addEventListener('change', function (e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function (event) {
        const container = document.getElementById('imagePreviewContainer');
        const preview = document.getElementById('imagePreview');
        preview.src = event.target.result;
        container.style.display = 'block';
      }
      reader.readAsDataURL(file);
    }
  });

  function togglePrice(val) {
    const priceGroup = document.getElementById('priceGroup');
    const priceInput = document.getElementById('price');
    if (val === 'Paid') {
      priceGroup.style.display = 'block';
      priceInput.required = true;
    } else {
      priceGroup.style.display = 'none';
      priceInput.required = false;
      priceInput.value = 0;
    }
  }

  document.getElementById('editEventForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const saveBtn = document.getElementById('saveBtn');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving...';

    const title = document.getElementById('title').value;
    const category = document.getElementById('category').value;
    const description = document.getElementById('description').value;
    const dateStr = document.getElementById('date').value;
    const timeStr = document.getElementById('time').value;
    const location = document.getElementById('location').value;
    const price = document.getElementById('price').value || 0;
    let image_url = document.getElementById('image_url').value;

    const imageFile = document.getElementById('imageUpload').files[0];

    try {
      // 1. Upload image if a new one is selected
      if (imageFile) {
        const formData = new FormData();
        formData.append('image', imageFile);
        const uploadRes = await fetch('/api/events/upload', {
          method: 'POST',
          body: formData
        });
        const uploadData = await uploadRes.json();
        if (uploadRes.ok) {
          image_url = uploadData.url;
        } else {
          showToast(uploadData.error || 'Image upload failed', 'error');
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save Changes';
          return;
        }
      }

      // 2. Save event details
      const isoDate = `${dateStr}T${timeStr}:00`;
      const payload = {
        title,
        category,
        description,
        date: isoDate,
        location,
        price: parseFloat(price),
        image_url,
        artist: document.getElementById('artist').value
      };

      const res = await fetch('/api/events/{{ event.event_id }}', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await res.json();

      if (res.ok) {
        showToast('Event updated successfully!', 'success');
        setTimeout(() => window.location.href = '/manage-events', 1500);
      } else {
        showToast(data.error || 'Failed to update event', 'error');
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save Changes';
      }
    } catch (err) {
      showToast('An error occurred', 'error');
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save Changes';
    }
  });
</script>
{% endblock %}
